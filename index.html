<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GPverse — Mare Alto</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d3550; overflow: hidden; touch-action: none; }
  #gioco { width: 100%; height: 100%; }
  canvas { display: block; image-rendering: pixelated; }
  #pannello { position: fixed; inset: 0; background: rgba(4, 12, 20, 0.82); display: grid; place-items: center; z-index: 10; font: 15px/1.4 monospace; color: #e8f2f6; }
  #pannello[hidden] { display: none; }
  #pannello .box { width: min(92vw, 520px); background: #0b1d26; border: 2px solid #c8a060; border-radius: 10px; padding: 18px; }
  #pannello h2 { margin: 0 0 6px; font-size: 18px; color: #f0e2b6; }
  #pannello p { margin: 0 0 10px; color: #9fc3d0; font-size: 13px; }
  #codice { width: 100%; height: 120px; box-sizing: border-box; background: #06131a; color: #d8f0ff; border: 1px solid #3a6a80; border-radius: 6px; font: 12px/1.3 monospace; padding: 8px; word-break: break-all; }
  #pannello .riga { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #pannello button { flex: 1; min-height: 44px; border: 0; border-radius: 6px; font: 15px monospace; color: #fff; background: #2f5f8a; cursor: pointer; }
  #btnCarica { background: #1f6a4a !important; }
  #btnChiudi { background: #4a3a2a !important; }
  #esito { margin-top: 10px; min-height: 1.4em; color: #ffd28a; font-size: 13px; }
</style>
</head>
<body>
<div id="gioco"></div>
<div id="pannello" hidden>
  <div class="box">
    <h2>Codice di salvataggio</h2>
    <p>Il gioco salva da solo su questo dispositivo. Per continuare la partita altrove, copia il codice e incollalo sull'altro dispositivo, poi premi Carica.</p>
    <textarea id="codice" spellcheck="false" placeholder="MAREALTO1:..."></textarea>
    <div class="riga">
      <button id="btnCopia" type="button">Copia</button>
      <button id="btnCarica" type="button">Carica</button>
      <button id="btnChiudi" type="button">Chiudi</button>
    </div>
    <div id="esito"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>window.Phaser || document.write('<script src="vendor/phaser.min.js"><\/script>');</script>
<script src="src/mondo.js"></script>
<script src="src/gioco.js"></script>
</body>
</html>
